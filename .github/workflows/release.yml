# On a version tag (v0.1.0), build on Arch and attach the binary tarball the
# omaread-bin AUR package installs from.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Release builds don't use incremental artifacts; skipping them keeps the
  # cached target directory small and restores faster.
  CARGO_INCREMENTAL: 0

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita webkitgtk-6.0 alsa-lib

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Caches ~/.cargo and target/; a warm run skips rebuilding the GTK,
      # WebKit and SQLite dependency graph.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          cache-on-failure: true

      # Test in the same profile the release is built in, so the dependency
      # graph is compiled once instead of once per profile.
      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          dir="omaread-${GITHUB_REF_NAME#v}-x86_64"
          mkdir "$dir"
          install -m755 target/release/omaread "$dir/"
          cp data/io.github.sarrietav_dev.Omaread.desktop data/io.github.sarrietav_dev.Omaread.svg \
            LICENSE README.md "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          sha256sum "$dir.tar.gz" > "$dir.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: omaread-*-x86_64.tar.gz*
          generate_release_notes: true
