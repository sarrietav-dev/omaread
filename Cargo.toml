[workspace]
resolver = "3"
members = ["crates/omaread-core", "crates/omaread"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
omaread-core = { path = "crates/omaread-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Dependencies (image decoding, zip, SQLite) optimized even in dev builds, so
# a debug run scans the library at release speed.
[profile.dev.package."*"]
opt-level = 2
